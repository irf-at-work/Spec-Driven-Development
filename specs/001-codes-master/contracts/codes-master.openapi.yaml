openapi: 3.1.0
info:
  title: Codes Master API
  version: 1.0.0
  description: Contract for reading and managing existing Oracle STD_CODES records.
servers:
  - url: /api
paths:
  /codes:
    get:
      operationId: listCodes
      summary: List Codes Master records
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: sortBy
          in: query
          required: false
          description: Column used to order filtered records before pagination.
          schema:
            $ref: "#/components/schemas/CodeSortColumn"
        - name: sortDirection
          in: query
          required: false
          description: Sort order for the selected column.
          schema:
            $ref: "#/components/schemas/CodeSortDirection"
        - name: codeOperator
          in: query
          required: false
          description: Case-insensitive filter operator for Code; must be supplied with codeValue.
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: codeValue
          in: query
          required: false
          description: Literal text used to filter Code.
          schema:
            type: string
        - name: codeDescriptionOperator
          in: query
          required: false
          description: Case-insensitive filter operator for Code Description; must be supplied with codeDescriptionValue.
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: codeDescriptionValue
          in: query
          required: false
          description: Literal text used to filter Code Description.
          schema:
            type: string
        - name: codeTypeOperator
          in: query
          required: false
          description: Case-insensitive filter operator for Type; must be supplied with codeTypeValue.
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: codeTypeValue
          in: query
          required: false
          description: Literal text used to filter Type.
          schema:
            type: string
        - name: value1Operator
          in: query
          required: false
          description: Case-insensitive filter operator for Value 1; must be supplied with value1Value.
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: value1Value
          in: query
          required: false
          description: Literal text used to filter Value 1.
          schema:
            type: string
        - name: value2Operator
          in: query
          required: false
          description: Case-insensitive filter operator for Value 2; must be supplied with value2Value.
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: value2Value
          in: query
          required: false
          description: Literal text used to filter Value 2.
          schema:
            type: string
      responses:
        "200":
          description: A page of code records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResult"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCode
      summary: Create a Codes Master record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeWrite"
      responses:
        "201":
          description: The record was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /codes/record:
    get:
      operationId: getCode
      summary: Retrieve a code by its composite key
      parameters:
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/CodeType"
      responses:
        "200":
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateCode
      summary: Update a record without changing its composite key
      parameters:
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/CodeType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeWrite"
      responses:
        "200":
          description: The updated record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCode
      summary: Delete a record identified by its composite key
      parameters:
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/CodeType"
      responses:
        "204":
          description: The record was deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /document-setups:
    get:
      operationId: listDocumentSetups
      summary: List document setups
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sortBy
          in: query
          schema:
            $ref: "#/components/schemas/DocumentSetupSortColumn"
        - name: sortDirection
          in: query
          schema:
            $ref: "#/components/schemas/CodeSortDirection"
        - name: docCodeOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: docCodeValue
          in: query
          schema:
            type: string
        - name: docNameOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: docNameValue
          in: query
          schema:
            type: string
        - name: docDescriptionOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: docDescriptionValue
          in: query
          schema:
            type: string
        - name: setupForOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: setupForValue
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of document setups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDocumentSetupResult"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDocumentSetup
      summary: Create a document setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSetupWrite"
      responses:
        "201":
          description: The document setup was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSetupRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /document-setups/{docCode}:
    parameters:
      - $ref: "#/components/parameters/DocumentCode"
    get:
      operationId: getDocumentSetup
      summary: Retrieve a document setup
      responses:
        "200":
          description: The requested document setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSetupRecord"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateDocumentSetup
      summary: Update a document setup without changing its code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSetupUpdate"
      responses:
        "200":
          description: The updated document setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSetupRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDocumentSetup
      summary: Delete a document setup only when it has no applicable modules
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "204":
          description: The document setup was deleted.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /document-setups/{docCode}/applicable-modules:
    parameters:
      - $ref: "#/components/parameters/DocumentCode"
    get:
      operationId: listApplicableModules
      summary: List applicable modules for a document
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sortBy
          in: query
          schema:
            $ref: "#/components/schemas/ApplicableModuleSortColumn"
        - name: sortDirection
          in: query
          schema:
            $ref: "#/components/schemas/CodeSortDirection"
        - name: applicableForOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: applicableForValue
          in: query
          schema:
            type: string
        - name: productFromOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: productFromValue
          in: query
          schema:
            type: string
        - name: productToOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: productToValue
          in: query
          schema:
            type: string
        - name: pcmFromOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: pcmFromValue
          in: query
          schema:
            type: string
        - name: pcmToOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: pcmToValue
          in: query
          schema:
            type: string
        - name: ccmFromOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: ccmFromValue
          in: query
          schema:
            type: string
        - name: ccmToOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: ccmToValue
          in: query
          schema:
            type: string
        - name: mandatoryYnOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: mandatoryYnValue
          in: query
          schema:
            type: string
        - name: activeYnOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: activeYnValue
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of applicable modules associated with the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApplicableModuleResult"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApplicableModule
      summary: Create an applicable module for a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicableModuleWrite"
      responses:
        "201":
          description: The applicable module was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicableModuleRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /document-setups/{docCode}/applicable-modules/{damodUid}:
    parameters:
      - $ref: "#/components/parameters/DocumentCode"
      - $ref: "#/components/parameters/ApplicableModuleUid"
    get:
      operationId: getApplicableModule
      summary: Retrieve an applicable module associated with a document
      responses:
        "200":
          description: The requested applicable module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicableModuleRecord"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateApplicableModule
      summary: Update an applicable module without changing its identity or parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicableModuleUpdate"
      responses:
        "200":
          description: The updated applicable module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicableModuleRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteApplicableModule
      summary: Delete an applicable module
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "204":
          description: The applicable module was deleted.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /claim-configurations:
    get:
      operationId: listClaimConfigurations
      summary: List claim configurations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sortBy
          in: query
          schema:
            $ref: "#/components/schemas/ClaimConfigurationSortColumn"
        - name: sortDirection
          in: query
          schema:
            $ref: "#/components/schemas/CodeSortDirection"
        - name: companyCodeOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: companyCodeValue
          in: query
          schema:
            type: string
        - name: ccmCodeOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: ccmCodeValue
          in: query
          schema:
            type: string
        - name: ccmNameOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: ccmNameValue
          in: query
          schema:
            type: string
        - name: shortNameOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: shortNameValue
          in: query
          schema:
            type: string
        - name: moduleNameOperator
          in: query
          schema:
            $ref: "#/components/schemas/CodeFilterOperator"
        - name: moduleNameValue
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of claim configurations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedClaimConfigurationResult"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createClaimConfiguration
      summary: Create a claim configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimConfigurationWrite"
      responses:
        "201":
          description: The claim configuration was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimConfigurationRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /claim-configurations/lookups/{liType}:
    get:
      operationId: getClaimConfigurationLookups
      summary: Get active lookup values for a CCM field
      parameters:
        - name: liType
          in: path
          required: true
          schema:
            type: string
            enum: [CCM_MODULE, CCM_POST_TYPE, CCM_EXCH_RATE, CCM_ROUND_TYPE, CCM_CURR_TYPE, CCM_CLO_REASON, CCM_DFLT_RECV_DEDU, CCM_PRODUCT]
      responses:
        "200":
          description: Active values and display descriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaimConfigurationLookupOption"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /claim-configurations/{ccmCode}:
    parameters:
      - $ref: "#/components/parameters/ClaimConfigurationCode"
    get:
      operationId: getClaimConfiguration
      summary: Retrieve a claim configuration
      responses:
        "200":
          description: The requested claim configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimConfigurationRecord"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateClaimConfiguration
      summary: Update a claim configuration without changing its code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimConfigurationUpdate"
      responses:
        "200":
          description: The updated claim configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimConfigurationRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteClaimConfiguration
      summary: Delete a claim configuration only when it has no Applicable Products
      responses:
        "204":
          description: The claim configuration was deleted.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /claim-configurations/{ccmCode}/products:
    parameters:
      - $ref: "#/components/parameters/ClaimConfigurationCode"
    get:
      operationId: listApplicableProducts
      summary: List Applicable Products for a claim configuration
      responses:
        "200":
          description: Applicable Product mappings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicableProductSummary"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApplicableProduct
      summary: Add a product mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicableProductWrite"
      responses:
        "201":
          description: The Applicable Product mapping was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicableProductRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /claim-configurations/{ccmCode}/products/{productCode}:
    parameters:
      - $ref: "#/components/parameters/ClaimConfigurationCode"
      - name: productCode
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getApplicableProduct
      summary: Retrieve one Applicable Product mapping
      responses:
        "200":
          description: The requested mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicableProductRecord"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateApplicableProduct
      summary: Change the product code for an existing mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicableProductUpdate"
      responses:
        "200":
          description: The updated mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicableProductRecord"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteApplicableProduct
      summary: Delete one Applicable Product mapping
      responses:
        "204":
          description: The mapping was deleted.
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [10, 15, 20, 50]
        default: 10
    DocumentCode:
      name: docCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 12
      description: Immutable document code; maximum 12 Oracle database-encoded bytes.
    ClaimConfigurationCode:
      name: ccmCode
      in: path
      required: true
      schema:
        type: string
      description: Immutable Claim Config Code; validated against the existing Oracle column metadata.
    ApplicableModuleUid:
      name: damodUid
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d+(\.\d+)?$'
      description: Decimal string representation of the Oracle NUMBER child key.
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: string
      description: Opaque version token from the record being deleted.
    Code:
      name: code
      in: query
      required: true
      schema:
        type: string
      description: First part of the composite key; maximum 12 Oracle database-encoded bytes.
    CodeType:
      name: codeType
      in: query
      required: true
      schema:
        type: string
      description: Second part of the composite key; maximum 20 Oracle database-encoded bytes.
  responses:
    Problem:
      description: A safe error response; no credential or raw diagnostic details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    CodeSortColumn:
      type: string
      enum: [Code, CodeDescription, CodeType, Value1, Value2]
      description: Data column to sort; Actions is not sortable.
    CodeSortDirection:
      type: string
      enum: [Ascending, Descending]
    DocumentSetupSortColumn:
      type: string
      enum: [DocCode, DocName, DocDescription, SetupFor, ActiveYn]
      description: Data column to sort; Actions is not sortable.
    ApplicableModuleSortColumn:
      type: string
      enum: [DamodUid, ApplicableFor, ProductFrom, ProductTo, PcmFrom, PcmTo, CcmFrom, CcmTo, MandatoryYn, ActiveYn]
      description: Data column to sort; Actions is not sortable.
    CodeFilterOperator:
      type: string
      enum:
        - StartsWith
        - EndsWith
        - Contains
        - DoesNotContain
        - EqualTo
        - NotEqualTo
    ClaimConfigurationSortColumn:
      type: string
      enum: [CompanyCode, Code, Name, ShortName, ModuleName]
      description: Data column to sort; Actions is not sortable.
    ClaimConfigurationWrite:
      type: object
      required: [ccmCode, ccmName]
      properties:
        ccmCode:
          type: string
          description: Immutable after creation; length follows the existing Oracle column semantics.
        ccmName:
          type: string
          description: Required claim configuration name.
        ccmShortName:
          type: [string, "null"]
        nameInArabic:
          type: [string, "null"]
        shortNameInArabic:
          type: [string, "null"]
        module:
          type: [string, "null"]
        postingType:
          type: [string, "null"]
        exchangeRateType:
          type: [string, "null"]
        roundingType:
          type: [string, "null"]
        roundingValue:
          type: [number, "null"]
          description: Must be between 0 and 999.99999 with no more than five decimal places.
        applicableCurrencies:
          type: [string, "null"]
        defaultEstimateCloseReasonCode:
          type: [string, "null"]
        defaultRecoveryCodeForDedl:
          type: [string, "null"]
        printBeforeApprovalYn:
          type: [string, "null"]
          enum: [Y, N, null]
        rePrintAllowedYn:
          type: [string, "null"]
          enum: [Y, N, null]
        claimAccountDocumentGenerationYn:
          type: [string, "null"]
          enum: [Y, N, null]
        sharingClaimsAccountDocumentGenerationYn:
          type: [string, "null"]
