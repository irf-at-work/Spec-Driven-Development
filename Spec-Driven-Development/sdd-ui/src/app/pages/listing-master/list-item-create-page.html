<section aria-labelledby="create-list-item-title">
  <a mat-button routerLink="/listing-master" queryParamsHandling="preserve">
    <mat-icon aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M20 12v-2H7.83l5.59-5.59L12 3 3 12l9 9 1.41-1.41L7.83 13H20z"
        />
      </svg>
    </mat-icon>
    Back to list items</a>
  <article class="details-panel">
    <header>
      <p class="eyebrow">List Item Master</p>
      <h1 id="create-list-item-title">Add list item</h1>
    </header>
    <app-list-item-form
      mode="create"
      [pending]="saving()"
      [apiError]="error()"
      [serverErrors]="validationErrors()"
      (submitted)="create($event)"
    />
  </article>
</section>
