<section aria-labelledby="company-form-title">
  <a mat-button routerLink="/company-master" queryParamsHandling="preserve">
    <mat-icon aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M20 12v-2H7.83l5.59-5.59L12 3 3 12l9 9 1.41-1.41L7.83 13H20z"
        />
      </svg>
    </mat-icon>
    Back to companies
  </a>
  <h1 id="company-form-title">{{ editing() ? 'Edit company' : 'Add company' }}</h1>

  @if (loading()) {
    <p role="status">Loading company…</p>
  } @else if (loadError(); as message) {
    <p class="error-message" role="alert">{{ message }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      @if (error(); as saveError) {
        <p class="error-message" role="alert">{{ saveError }}</p>
      }
      <app-company-fields
        [form]="form"
        [mode]="editing() ? 'edit' : 'add'"
        [datePickerMode]="true"
        [errorFor]="fieldError.bind(this)"
      />
      <div class="form-actions">
        <button
          mat-button
          type="button"
          [routerLink]="
            editing() ? ['/company-master', form.controls.companyCode.value] : ['/company-master']
          "
          queryParamsHandling="preserve"
        >
          Cancel
        </button>
        <button mat-flat-button type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </form>
  }
</section>
