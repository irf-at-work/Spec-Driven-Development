<mat-toolbar class="app-toolbar">
  <span class="application-name">Broker Insurance</span>
</mat-toolbar>

<div class="app-shell">
  <aside class="master-navigation" aria-label="Main navigation">
    <button
      mat-button
      class="master-navigation-toggle"
      type="button"
      aria-controls="master-navigation-links"
      [attr.aria-expanded]="isMasterNavigationExpanded()"
      (click)="toggleMasterNavigation()"
    >
      <span>Masters</span>
      <svg
        class="master-navigation-chevron"
        [class.expanded]="isMasterNavigationExpanded()"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m7 10 5 5 5-5" />
      </svg>
    </button>
    @if (isMasterNavigationExpanded()) {
      <nav id="master-navigation-links">
        @for (item of masterNavigation; track item.path) {
          <a
            mat-button
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    }
  </aside>

  <main class="main-content" id="main-content">
    <router-outlet />
  </main>
</div>
