<mat-toolbar class="app-toolbar">
  <span class="application-name">Broker Insurance</span>
</mat-toolbar>

<div class="app-shell">
  <aside class="master-navigation" aria-label="Main navigation">
    <h2>Master</h2>
    <nav>
      @for (item of masterNavigation; track item.path) {
        <a
          mat-button
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <main class="main-content" id="main-content">
    <router-outlet />
  </main>
</div>
