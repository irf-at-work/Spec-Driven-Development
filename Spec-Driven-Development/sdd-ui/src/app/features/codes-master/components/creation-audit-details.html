<span
  class="audit-control"
  cdkOverlayOrigin
  #auditOrigin="cdkOverlayOrigin"
  (mouseenter)="open()"
  (mouseleave)="scheduleClose()"
>
  <button
    type="button"
    class="audit-button"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="isOpen()"
    (focus)="open()"
    (blur)="scheduleClose()"
    (click)="open()"
  >
    <span aria-hidden="true">i</span>
  </button>
</span>

<ng-template
  cdk-connected-overlay
  [cdkConnectedOverlayOrigin]="auditOrigin"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="overlayPositions"
  [cdkConnectedOverlayPush]="true"
  (overlayOutsideClick)="close()"
>
  <span class="audit-tooltip" role="tooltip" (mouseenter)="cancelClose()" (mouseleave)="close()">
    {{ details() }}
  </span>
</ng-template>
