<section class="form-page" aria-labelledby="add-code-heading">
  <header class="page-header">
    <div>
      <h1 id="add-code-heading">Codes Master</h1>
      <p>Enter the details for the new code.</p>
    </div>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      form="codes-master-code-form"
      [disabled]="isSubmitting()"
    >
      Add
    </button>
  </header>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }

  <app-code-form-fields [form]="form" [serverErrors]="serverErrors()" (submitted)="save()">
    <div class="form-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
        Save
      </button>
      <button mat-button type="button" [disabled]="isSubmitting()" (click)="leavePage()">
        Cancel
      </button>
      <button mat-button type="button" [disabled]="isSubmitting()" (click)="leavePage()">
        Back
      </button>
    </div>
  </app-code-form-fields>
</section>
