<nav class="page-breadcrumb codes-add-breadcrumb" aria-label="Breadcrumb">
  <ol>
    <li><a routerLink="/codes">Codes Master</a></li>
    <li aria-current="page">Add Code</li>
  </ol>
</nav>
<section class="form-page" aria-labelledby="add-code-heading">
  <header class="page-header">
    <div>
      <h1 id="add-code-heading">Codes Master</h1>
    </div>
    <div class="page-header-actions">
      <button
        mat-stroked-button
        color="primary"
        type="button"
        [disabled]="isSubmitting()"
        (click)="resetForm()"
      >
        Add
      </button>
      <button
        mat-stroked-button
        color="primary"
        type="button"
        [disabled]="isSubmitting()"
        (click)="leavePage()"
      >
        Back
      </button>
    </div>
  </header>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }

  <div class="form-card">
    <app-code-form-fields
      [form]="form"
      [serverErrors]="serverErrors()"
      [resetVersion]="formResetVersion()"
      (submitted)="save()"
    >
      <div class="form-actions">
        <button mat-stroked-button color="primary" type="submit" [disabled]="isSubmitting()">
          Save
        </button>
        <button
          mat-stroked-button
          color="primary"
          type="button"
          [disabled]="isSubmitting()"
          (click)="resetForm()"
        >
          Cancel
        </button>
      </div>
    </app-code-form-fields>
  </div>
</section>
