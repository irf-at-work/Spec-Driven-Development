<section class="form-page" aria-labelledby="edit-code-heading">
  <header class="page-header">
    <div>
      <h1 id="edit-code-heading">Codes Master</h1>
    </div>
    <div class="page-header-actions">
      @if (loadedRecord(); as record) {
        <app-creation-audit-details [record]="record" />
      }
      <a mat-flat-button color="primary" routerLink="/codes/add"> Add </a>
      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="isSubmitting()"
        (click)="leavePage()"
      >
        Back
      </button>
    </div>
  </header>

  @if (isLoading()) {
    <p role="status">Loading code details…</p>
  } @else if (errorMessage() && !recordLoaded()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  } @else {
    @if (errorMessage()) {
      <p class="error-message" role="alert">{{ errorMessage() }}</p>
    }

    <app-code-form-fields
      [form]="form"
      [serverErrors]="serverErrors()"
      [identityReadonly]="true"
      [resetVersion]="formResetVersion()"
      (submitted)="save()"
    >
      <div class="form-actions">
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="isSubmitting() || !recordLoaded()"
        >
          Save
        </button>
        <button
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="isSubmitting()"
          (click)="resetForm()"
        >
          Reset
        </button>
      </div>
    </app-code-form-fields>
  }
</section>
