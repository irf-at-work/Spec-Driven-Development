<section class="shared-presentation-example" aria-labelledby="shared-example-title">
  <div>
    <h2 id="shared-example-title">Shared style examples</h2>
    <p>Reusable controls keep master-data screens consistent.</p>
  </div>

  <label class="shared-field">
    <span>Example filter</span>
    <input
      class="shared-input"
      type="search"
      aria-label="Search examples"
      placeholder="Search examples"
    />
  </label>

  <div class="shared-table-wrapper" data-testid="shared-table-wrapper">
    <table class="shared-table" aria-label="Example records">
      <caption>
        Example records
      </caption>
      <thead>
        <tr>
          <th scope="col">Record</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Example record A</td>
          <td>Active</td>
        </tr>
        <tr>
          <td>Example record B</td>
          <td>Inactive</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
