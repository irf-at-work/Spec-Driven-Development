<div class="filter-control">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-value">
    <mat-label>Filter by {{ label().toLowerCase() }}</mat-label>
    <input
      matInput
      [attr.aria-label]="'Filter by ' + label().toLowerCase()"
      [ngModel]="value()"
      (ngModelChange)="emitValue($event)"
    />
  </mat-form-field>
  <div class="operator-control" [class.operator-active]="operator() !== null">
    <mat-icon aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          [attr.fill]="operator() === null ? 'none' : 'currentColor'"
          [attr.stroke]="operator() === null ? 'currentColor' : 'none'"
          stroke-width="1.8"
          stroke-linejoin="round"
          d="M3 4h18l-7 8v6l-4 3v-9L3 4z"
        />
      </svg>
    </mat-icon>
    <select
      [attr.aria-label]="label() + ' operator'"
      [attr.title]="label() + ' operator'"
      [ngModel]="operator()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="emitOperator($event)"
    >
      <option value="" hidden></option>
      @for (option of operators; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>
  <button
    mat-icon-button
    type="button"
    class="clear-filter"
    [attr.aria-label]="'Clear ' + label().toLowerCase() + ' filter'"
    [disabled]="!value() && operator() === null"
    (click)="clear()"
  >
    <mat-icon aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19l1.4-1.4L13.4 12z"
        />
      </svg>
    </mat-icon>
  </button>
</div>
